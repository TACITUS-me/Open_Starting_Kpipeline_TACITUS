name: Maintained policy reference
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: maintained-pipeline/reference-pipeline
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python benchmarks/run.py
